
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#100b20">
    <title>VIBE MUSIC</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <h1>VIBE<span>MUSIC</span></h1>
        <p>Feel every beat.</p>
    </header>

    <main class="container">

        <section class="search-section">
            <input id="search" type="search"
                placeholder="Найти музыку...">
            <button id="searchBtn">Найти</button>
        </section>

        <section>
            <h2>Онлайн-поиск</h2>
            <div id="searchResults" class="cards">
                <p>Ищи любимую музыку через интернет.</p>
            </div>
        </section>

        <section>
            <h2>Моя музыка</h2>
            <div id="cards" class="cards"></div>
        </section>

        <section>
            <h2>Мои плейлисты</h2>
            <div class="playlist-create">
                <input id="playlistName"
                    placeholder="Название плейлиста">
                <button id="createPlaylist">Создать</button>
            </div>
            <div id="playlistList"></div>
        </section>

        <section class="player">
            <img id="nowCover"
                src="https://placehold.co/300x300/211638/ffffff?text=VIBE"
                alt="Обложка">

            <h2 id="nowTitle">Выбери трек</h2>
            <p id="nowArtist">VIBE MUSIC</p>

            <div class="progress">
                <span id="elapsed">0:00</span>
                <div id="progressBar">
                    <div id="fill"></div>
                </div>
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button id="previous">◀|</button>
                <button id="play">▶</button>
                <button id="next">|▶</button>
            </div>
        </section>

    </main>

    <script src="js/player.js"></script>
    <script src="js/search.js"></script>
    <script src="js/playlists.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
