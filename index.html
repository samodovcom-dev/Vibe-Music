
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE MUSIC</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    --bg: #080710;
    --panel: #12101f;
    --panel2: #1a1530;
    --purple: #8b35ff;
    --pink: #c34dff;
    --text: #ffffff;
    --muted: #9992b5;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

button {
    border: none;
    cursor: pointer;
    color: white;
    font-family: inherit;
}

.app {
    display: flex;
    min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 245px;
    padding: 28px 18px;
    background: #0d0b17;
    border-right: 1px solid #241b3c;
    display: flex;
    flex-direction: column;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 40px;
}

.logo-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, #8b35ff, #d24bff);
    border-radius: 15px;
    display: grid;
    place-items: center;
    font-size: 24px;
    box-shadow: 0 0 25px #8b35ff55;
}

.logo h2 {
    font-size: 18px;
    letter-spacing: 1px;
}

.logo small {
    display: block;
    color: var(--muted);
    margin-top: 4px;
    font-size: 11px;
}

.nav-title {
    color: #716b88;
    font-size: 11px;
    margin: 15px 10px;
    letter-spacing: 1.5px;
}

.nav-btn {
    width: 100%;
    background: transparent;
    text-align: left;
    padding: 14px;
    border-radius: 13px;
    margin-bottom: 6px;
    color: #aaa3c1;
    transition: .2s;
    font-size: 14px;
}

.nav-btn:hover,
.nav-btn.active {
    background: linear-gradient(90deg, #7425dc44, #8b35ff12);
    color: white;
}

.nav-btn.active {
    border-left: 3px solid var(--purple);
}

.sidebar-bottom {
    margin-top: auto;
    padding: 15px;
    background: var(--panel);
    border: 1px solid #2c2145;
    border-radius: 15px;
}

.sidebar-bottom p {
    color: var(--muted);
    font-size: 12px;
    margin-top: 8px;
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    padding: 30px;
    padding-bottom: 120px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
}

.greeting h1 {
    font-size: 27px;
}

.greeting p {
    color: var(--muted);
    margin-top: 8px;
}

.search {
    width: min(360px, 100%);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 17px;
    background: var(--panel);
    border: 1px solid #302347;
    border-radius: 30px;
}

.search input {
    width: 100%;
    background: transparent;
    outline: none;
    border: none;
    color: white;
    font-size: 14px;
}

.search input::placeholder {
    color: #77708e;
}

/* HERO */

.hero {
    display: grid;
    grid-template-columns: 1.3fr .7fr;
    gap: 20px;
    margin-bottom: 30px;
}

.hero-card {
    min-height: 260px;
    border-radius: 23px;
    padding: 28px;
    background:
      radial-gradient(circle at 85% 20%, #a33cff55, transparent 35%),
      linear-gradient(135deg, #21123b, #11101e);
    border: 1px solid #3a255c;
    position: relative;
    overflow: hidden;
}

.hero-card h2 {
    font-size: 28px;
    margin-bottom: 10px;
}

.hero-card p {
    color: #b6a9d6;
    margin-bottom: 25px;
}

.primary-btn {
    background: linear-gradient(135deg, #8b35ff, #c34dff);
    padding: 13px 24px;
    border-radius: 30px;
    font-weight: 600;
    box-shadow: 0 5px 25px #8b35ff44;
}

.hero-note {
    position: absolute;
    right: 30px;
    bottom: 20px;
    font-size: 90px;
    opacity: .18;
}

.stats-card {
    background: var(--panel);
    border: 1px solid #302347;
    border-radius: 23px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.stats-card .big {
    font-size: 34px;
    font-weight: 800;
    color: #c17aff;
}

.stats-card p {
    color: var(--muted);
    margin-top: 8px;
}

/* SECTIONS */

.section {
    margin-bottom: 30px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.section
