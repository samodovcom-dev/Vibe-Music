
name: Build VIBE MUSIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android assets
        run: |
          mkdir -p android/app/src/main/assets/css
          mkdir -p android/app/src/main/assets/js

          cp index.html android/app/src/main/assets/index.html
          cp css/style.css android/app/src/main/assets/css/style.css
          cp js/*.js android/app/src/main/assets/js/

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBE-MUSIC-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
