
name: Build VIBE MUSIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android manifest
        run: |
          echo "----- AndroidManifest.xml -----"
          sed -n '1,160p' android/app/src/main/AndroidManifest.xml
          echo "----- File information -----"
          file android/app/src/main/AndroidManifest.xml

      - name: Prepare Android assets
        run: |
          mkdir -p android/app/src/main/assets/css
          mkdir -p android/app/src/main/assets/js

          cp index.html android/app/src/main/assets/index.html
          cp css/style.css android/app/src/main/assets/css/style.css

          cp js/player.js android/app/src/main/assets/js/player.js
          cp js/search.js android/app/src/main/assets/js/search.js
          cp js/playlists.js android/app/src/main/assets/js/playlists.js
          cp js/app.js android/app/src/main/assets/js/app.js

      - name: Build APK
        run: gradle -p android assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBE-MUSIC-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
